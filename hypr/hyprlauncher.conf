# ========================================================
# ~/.config/hypr/hyprlauncher.conf
# hyprlauncher 启动器配置文件
# ========================================================

general {
    # 是否强制获取全局键盘焦点
    grab_focus = true
}

cache {
    # 开启常用项目缓存
    enabled = true
}

finders {
    # 默认启动的查找器
    default_finder = desktop
    
    # 桌面搜索前缀
    desktop_prefix = 
    
    # Unicode 字符搜索前缀
    unicode_prefix = 
    
    # 数学计算前缀（输入 "= 1+1"）
    math_prefix = =
    
    # 字体查找前缀（输入 "' arial"）
    font_prefix = '
    
    # 桌面应用启动前缀
    desktop_launch_prefix = 
    
    # 是否显示应用图标
    desktop_icons = true
}

ui {
    # 启动器窗口尺寸（宽度 高度）
    window_size = 800 600
}
