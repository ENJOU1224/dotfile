# hyprlock.conf - Hyprland 锁屏配置
# 配置文档: https://wiki.hyprland.org/Hyprlock/

# ==================== 背景设置 ====================
background {
    monitor =                    # 监视器，留空为所有监视器
    path = screenshot            # 背景图片路径，screenshot 为截取当前屏幕
    #path = /home/enjou/Pictures/BingWallpaper/20241001-HalfDomeYosemite_ROW8093920979_UHD.jpg
    color = rgba(17, 17, 17, 1.0)  # 背景颜色（图片加载前的填充色）
    
    # 模糊效果
    blur_passes = 3              # 模糊次数，0 为禁用模糊
    blur_size = 7                # 模糊大小
    noise = 0.0117               # 噪点强度
    contrast = 0.8916            # 对比度
    brightness = 0.8172          # 亮度
    vibrancy = 0.1696            # 饱和度增强
    vibrancy_darkness = 0.0      # 暗部饱和度增强强度
    
    # 重载设置
    reload_time = -1             # 重载间隔（秒），0 为使用 SIGUSR2 信号重载，-1 为禁用
    reload_cmd =                 # 获取新路径的命令
    crossfade_time = -1.0        # 背景切换淡入淡出时间（秒），负数为禁用
    zindex = -1                  # 图层顺序，-1 为最底层
}

# ==================== 通用设置 ====================
general {
    hide_cursor = false          # 是否隐藏光标
    ignore_empty_input = false   # 是否跳过空密码验证
    immediate_render = false     # 是否立即渲染（不等待资源加载）
    text_trim = true             # 是否裁剪文本（去除末尾换行符）
    fractional_scaling = 2       # 分数缩放：0=禁用，1=启用，2=自动
    screencopy_mode = 0          # 截屏模式：0=GPU加速，1=CPU（慢）
    fail_timeout = 2000          # 认证失败后UI重置时间（毫秒）
}

# ==================== 认证设置 ====================
auth {
    # PAM 认证
    pam:enabled = true           # 启用 PAM 认证
    pam:module = hyprlock        # PAM 模块名（如不在 /etc/pam.d 中则使用 su 作为后备）
    
    # 指纹认证（需要 fprintd）
    fingerprint:enabled = false  # 启用指纹认证
    fingerprint:ready_message = (Scan fingerprint to unlock)   # 就绪提示
    fingerprint:present_message = Scanning fingerprint         # 扫描中提示
    fingerprint:retry_delay = 250  # 重试延迟（毫秒）
}

# ==================== 动画设置 ====================
animations {
    enabled = true               # 启用动画
    
    # 贝塞尔曲线定义
    # 格式：bezier = 名称, x1, y1, x2, y2
    bezier = easeOut, 0.25, 0.1, 0.25, 1.0    # 缓出曲线
    bezier = easeInOut, 0.42, 0, 0.58, 1.0     # 缓入缓出曲线
    bezier = linear, 1, 1, 0, 0                # 线性曲线
    
    # 动画定义
    # 格式：animation = 名称, 开关, 持续时间(秒), 曲线[, 风格]
    # fade: 锁屏淡入淡出动画
    animation = fade, 1, 5.0, easeInOut        # 淡入淡出，持续3秒
    
    # inputField: 输入框相关动画
    animation = inputField, 1, 2.5, easeOut    # 输入框动画，持续2.5秒
    animation = inputFieldColors, 1, 2.0, easeOut    # 输入框颜色渐变
    animation = inputFieldFade, 1, 2.0, easeOut      # 输入框空时淡出
    animation = inputFieldWidth, 1, 2.0, easeOut     # 输入框自适应宽度
    animation = inputFieldDots, 1, 1.5, easeOut      # 输入指示器点动画
}

# ==================== 密码输入框 ====================
input-field {
    monitor =                    # 监视器，留空为所有监视器
    size = 300, 50               # 大小（像素或百分比，如 20%, 5%）
    outline_thickness = 0        # 边框厚度，0 为填充模式
    
    # 输入指示器设置
    dots_size = 0.26             # 点大小（相对于输入框高度，0.2-0.8）
    dots_spacing = 0.64          # 点间距（相对于点大小，0.0-1.0）
    dots_center = true           # 点居中显示
    dots_rounding = -1           # 点圆角，-1 为圆形
    dots_text_format =           # 自定义输入指示符（留空为默认方块）
    
    # 外观设置
    rounding = 22                # 输入框圆角
    outer_color = rgba(1, 1, 1, 0.3)      # 边框颜色（渐变色）
    inner_color = rgba(216, 216, 216, 0.3) # 内部填充颜色
    font_color = rgb(200, 200, 200)        # 字体颜色
    font_family = Noto Sans      # 字体
    
    # 淡出效果
    fade_on_empty = true         # 空时淡出
    fade_timeout = 350           # 淡出延迟（毫秒）
    
    # 文本设置
    placeholder_text = <i>Enter Password</i>  # 占位文本（支持 pango 标记）
    
    # 隐藏输入模式（类似 swaylock）
    hide_input = false           # 启用隐藏输入模式
    hide_input_base_color = rgba(153, 170, 187, 1.0)  # 基础颜色（色相会随机旋转）
    
    # 状态颜色（渐变色）
    check_color = rgba(204, 136, 34, 1.0)    # 等待验证时的颜色
    fail_color = rgba(204, 34, 34, 1.0)      # 验证失败时的颜色
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>   # 失败文本（$FAIL=原因，$ATTEMPTS=次数）
    capslock_color = rgba(250, 250, 250, 1.0)     # Caps Lock 激活时的颜色
    numlock_color =              # Num Lock 激活时的颜色
    bothlock_color =             # 两个锁都激活时的颜色
    invert_numlock = false       # Num Lock 关闭时改变颜色
    swap_font_color = false      # 状态变化时交换字体和内部颜色
    
    # 位置设置
    position = 0, 120            # 位置偏移
    halign = center              # 水平对齐：left, center, right, none
    valign = bottom              # 垂直对齐：top, center, bottom, none
    zindex = 0                   # 图层顺序
}

# ==================== 时间标签 ====================
label {
    monitor =                    # 监视器，留空为所有监视器
    
    # 文本设置
    # cmd[update:时间(毫秒)] 命令 - 定时执行命令更新文本
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    text_align = center          # 多行文本对齐：center, right, left
    color = rgba(216, 222, 233, 0.85)  # 文本颜色
    font_size = 500              # 字体大小
    font_family = Misans Medium  # 字体
    rotate = 0                   # 旋转角度（度，逆时针）
    
    # 阴影设置
    shadow_passes = 10           # 阴影模糊次数，0 为禁用
    shadow_size = 10             # 阴影大小
    shadow_color = rgb(0,0,0)    # 阴影颜色
    shadow_boost = 1.2           # 阴影透明度增强
    
    # 位置设置
    position = 0, 0              # 位置偏移
    halign = center              # 水平对齐
    valign = center              # 垂直对齐
    zindex = 0                   # 图层顺序
    
    # 点击事件
    onclick =                    # 点击时执行的命令
}

# ==================== 可用变量 ====================
# 在 label 的 text 中可以使用以下变量：
# $USER - 用户名
# $DESC - 用户描述
# $TIME - 24小时制时间
# $TIME12 - 12小时制时间
# $LAYOUT - 当前键盘布局
# $ATTEMPTS - 失败尝试次数
# $FAIL - 最后一次失败原因
# $PAMPROMPT - PAM 认证提示
# $PAMFAIL - PAM 认证失败原因
# $FPRINTPROMPT - 指纹认证提示
# $FPRINTFAIL - 指纹认证失败原因

# ==================== 快捷键 ====================
# ESC - 清空密码
# Ctrl+u - 清空密码
# Ctrl+Backspace - 清空密码
