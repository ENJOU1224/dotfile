# hyprtoolkit 主题配置文件
# 马卡龙色系 - 浅黄色主题

# 背景颜色（奶油黄）
background = 0xFFFFF8E7

# 基础颜色（浅黄奶油）
base = 0xFFFFF5DC

# 文本颜色（深棕色）
text = 0xFF5D4E37

# 备选基础颜色（浅杏色）
alternate_base = 0xFFFFECCC

# 高亮文本颜色（浅珊瑚粉）
bright_text = 0xFFFF9A8B

# 主题色（马卡龙桃粉）
accent = 0xFFFFAEC9

# 次要主题色（马卡龙薄荷绿）
accent_secondary = 0xFF98D8C8

# 字体大小设置 - 增大字号让界面更清晰
h1_size = 24
h2_size = 20
h3_size = 18
font_size = 16
small_font_size = 14

# 字体设置 - 使用 MiSans VF
font_family = MiSans VF
font_family_monospace = Sarasa Mono SC

# 图标主题（留空则使用默认）
icon_theme = 

# 圆角设置（逻辑像素）- 马卡龙风格用更大圆角
rounding_large = 16
rounding_small = 8
