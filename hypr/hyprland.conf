# Hyprland 配置文件
# 文档: https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

################
### MONITORS ###
################

# 主显示器配置：10bit色深，可变刷新率
monitor=eDP-1,preferred,auto,auto,bitdepth,10,vrr,3

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = nautilus
$menu = hyprlauncher

#################
### AUTOSTART ###
#################

# 壁纸轮换脚本
exec-once = /home/enjou/temp/2024/11/UpdateWallpaper/StartHyprpaper.sh &
# 状态栏、代理、输入法、空闲锁定
exec-once = waybar & clash-verge & fcitx5 -d & hypridle
# 自动切换暗色模式
exec-once = /home/enjou/.local/bin/autodark
# 桌面门户、权限代理、密钥环
exec-once = /usr/libexec/xdg-desktop-portal-hyprland
exec-once = sleep 2 && /usr/libexec/hyprpolkitagent
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,ssh
exec-once = dbus-update-activation-environment --systemd --all
# 登录时预启动 scratch 终端，确保第一次 Super+S 打开时有稳定的初始窗口
exec-once = [workspace special:magic silent] kitty --class magic-term

#############################
### ENVIRONMENT VARIABLES ###
#############################

# 禁用原子模式提交，部分显卡兼容性需要
env = WLR_DRM_NO_ATOMIC,1
# Intel 显卡驱动优化
env = MESA_LOADER_DRIVER_OVERRIDE,iris
# 禁用 NVIDIA G-Sync（避免多显示器问题）
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0
# 光标大小
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Qt 主题集成
env = QT_QPA_PLATFORMTHEME,qt5ct

#####################
### LOOK AND FEEL ###
#####################

# 窗口和布局通用设置
general {
    gaps_in = 2          # 窗口间间隙
    gaps_out = 5         # 屏幕边缘间隙
    gaps_workspaces = 10 # 工作区间隙
    border_size = 2      # 边框粗细

    # 渐变色边框：活跃窗口青绿渐变，非活跃窗口灰色
    col.active_border = rgba(a0ffffae) rgba(ffffa0ae)
    col.inactive_border = rgba(595959aa)

    resize_on_border = false  # 禁止拖拽边框调整大小
    allow_tearing = false     # 禁止画面撕裂
    layout = master           # 使用 master 布局
}

# 窗口装饰效果
decoration {
    rounding = 8              # 圆角半径
    active_opacity = 1        # 活跃窗口不透明度
    inactive_opacity = 0.9575 # 非活跃窗口轻微透明
    dim_inactive = true       # 非活跃窗口变暗
    dim_strength = 0.2        # 变暗强度

    shadow {
        enabled = false
        range = 8
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 1
        passes = 1
        new_optimizations = true
        vibrancy = 0.1696
    }
}

# 动画配置
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier           # 窗口出现
    animation = windowsOut, 1, 7, default, popin 80%  # 窗口消失
    animation = border, 1, 10, default            # 边框变化
    animation = borderangle, 1, 8, default        # 边框角度
    animation = fade, 1, 7, default               # 淡入淡出
    animation = workspaces, 1, 6, myBezier, slidefade 20%  # 工作区切换
    # special workspace 从上方滑入
    animation = specialWorkspace, 1, 10, myBezier, slidefadevert -50%
}

# # Dwindle 布局设置（备用）
# dwindle {
#     pseudotile = true
#     preserve_split = true
# }

# Master 布局设置
master {
    new_status = slave
}

# 杂项设置
misc {
    force_default_wallpaper = 0       # 禁用默认的二次元壁纸背景
    disable_hyprland_logo = true      # 禁用 Hyprland 的 Logo / 背景
    disable_splash_rendering = true   # 禁用屏幕底部的随机标语 (Splash)
}

#############
### INPUT ###
#############

# 键盘和触摸板设置
input {
    kb_layout = us
    follow_mouse = 1     # 鼠标移动时跟随焦点
    sensitivity = 0      # 鼠标灵敏度（0=不修改）

    touchpad {
        natural_scroll = true  # 自然滚动
    }
}

# 三指水平滑动切换工作区
gesture = 3, horizontal, workspace

# 特定设备灵敏度调整
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

#####################
### KEYBINDINGS   ###
#####################

$mainMod = SUPER

# === 窗口管理 ===
bind = $mainMod SHIFT, return, exec, $terminal
bind = $mainMod SHIFT, C, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod, E, exec, microsoft-edge --ozone-platform=wayland --enable-wayland-ime --password-store=gnome-libsecret
bind = $mainMod, O, exec, $fileManager
bind = $mainMod, M, fullscreen
bind = $mainMod, F, togglefloating
bind = $mainMod, P, exec, $menu
bind = $mainMod SHIFT, L, exec, hyprlock

# === 电源键 ===
bind = , XF86PowerOff, exec, loginctl lock-session

# === 截图 ===
$hyprshot = $HOME/.local/bin/hyprshot
bind = , Print, exec, $hyprshot -m region
bind = Alt, Print, exec, $hyprshot -m window
bind = Shift, Print, exec, $hyprshot -m output

# === 音量调节 ===
bind = , XF86AudioMute, exec, amixer -q -D pulse sset Master toggle
bind = , XF86AudioLowerVolume, exec, amixer -q -D pulse sset Master 2%- unmute
bind = , XF86AudioRaiseVolume, exec, amixer -q -D pulse sset Master 2%+ unmute

# === 亮度调节 ===
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86KbdbrightnessOn, exec, brightnessctl -d asus::kbd_backlight set 1

# === 窗口聚焦切换 ===
# Super+J/K：scratch 可见时切换堆叠，否则切换 master 布局
bind = $mainMod, J, exec, ~/.local/bin/magic-stack next-key
bind = $mainMod, K, exec, ~/.local/bin/magic-stack prev-key
bind = $mainMod, C, layoutmsg, focusmaster

# === Master 布局操作 ===
bind = $mainMod, return, layoutmsg, swapwithmaster
bind = $mainMod, I, layoutmsg, addmaster
bind = $mainMod, D, layoutmsg, removemaster

# 工作区切换行为
binds {
    workspace_back_and_forth = false
    allow_workspace_cycles = true
}
bind = Alt, Tab, workspace, previous

# === 窗口大小调整 ===
bind = $mainMod, L, resizeactive, 10 0
bind = $mainMod, H, resizeactive, -10 0

# === 工作区切换 ===
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# === 移动窗口到工作区 ===
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# === Scratchpad 终端堆叠 ===
# Super+S：显示/隐藏 scratch，空时自动创建终端
# Super+Ctrl+S：在 scratch 里新开终端并层叠排列
# Super+Shift+S：把当前窗口移到 scratch
bind = $mainMod, S, exec, ~/.local/bin/magic-stack toggle
bind = $mainMod CTRL, S, exec, ~/.local/bin/magic-stack spawn
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# === 鼠标操作 ===
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

##############################
### WINDOWS AND WORKSPACES ###
##############################

# === 通用浮动窗口规则 ===
windowrule = float on, match:class xdg-desktop-portal-gtk
windowrule = float on, match:class nautilus, match:title Properties
windowrule = float on, match:class nautilus, match:title Copying
windowrule = float on, match:title Confirmation
windowrule = float on, match:title File Operation Progress
windowrule = float on, match:class pavucontrol
windowrule = float on, match:class blueman-manager
windowrule = float on, match:class nm-connection-editor
windowrule = float on, match:class org.kde.polkit-kde-authentication-agent-1
windowrule = float on, match:class btop
windowrule = size 1000 700, match:class btop
windowrule = center on, match:class btop

# === Scratch 终端规则 (special:magic) ===
# magic-stack 脚本负责堆叠排列，这里统一控制尺寸和浮动
# class 和 workspace 两组规则确保预启动窗口和新建窗口都能正确应用
windowrule = match:class magic-term, float on
windowrule = match:class magic-term, size (monitor_w*0.85) (monitor_h*0.75)
windowrule = match:class magic-term, center on
windowrule = match:workspace special:magic, float on
windowrule = match:workspace special:magic, size (monitor_w*0.85) (monitor_h*0.75)
windowrule = match:workspace special:magic, center on
